[package]
name = "sab_formats"
version = "0.1.0"
edition = "2021"
description = "The Saboteur (2009) asset-format library: readers and writers for the game's containers and assets."
license = "MIT"

[dependencies]
# SGES block decompression and SafeSlice (SGES is byte-identical between the two games,
# docs/formats/archive_and_models.md).
mercs2_formats = "3.0"
# zlib streams inside SBLA sub-packs (DTEX mip payloads, MSHA blobs: raw 78 01 zlib).
flate2 = "1"

[profile.release]
opt-level = 3

[features]
# Builds the game-gated tests, which read the installs named by the repo-root `.sab-local.toml`
# (see `game_paths`) and fail naming whatever is missing: `cargo test --features retail`.
retail = []

[[test]]
name = "local_config_retail"
required-features = ["retail"]

[[test]]
name = "archive_retail"
required-features = ["retail"]

[[test]]
name = "sbla_retail"
required-features = ["retail"]
